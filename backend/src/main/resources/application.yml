# ============================================================================
#  IPAS 智能助手 —— 主配置文件
#
#  本文件集中管理应用的所有可调参数，并通过 @ConfigurationProperties 绑定到
#  AppProperties 类，各模块统一从该类读取配置（配置只在启动时绑定一次，避免散落各处）。
#
#  凡是以 ${XXX:默认值} 形式出现的，都可以用环境变量覆盖：
#  既能在本地直接用默认值跑起来，也能在部署时用环境变量注入而不改代码。
# ============================================================================

server:
  # 监听 127.0.0.1:8002。
  # 必须显式绑 127.0.0.1 而不是 localhost —— Windows 下 localhost 会解析到 ::1，
  # 而前端 vite 代理配的是 http://127.0.0.1:8002，绑错会报 upstream connect failed。
  address: 127.0.0.1
  port: 8002
  # 关掉 Spring 默认的错误页 JSON 包装，改由 GlobalExceptionHandler 统一输出
  # {"detail": "..."} 形式的错误体，保证前端错误处理逻辑一致。
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: smart-assistant-java

  # ---------------------------------------------------------------- 虚拟线程
  # 打开 Java 21 的虚拟线程：Tomcat 的请求处理改用虚拟线程。
  #
  # 【为什么这里收益明显】本项目几乎全是"等待型"IO —— 等大模型吐 token、等数据库、
  # 等嵌入服务。平台线程在阻塞等待时仍占着约 1MB 栈内存；虚拟线程在等待时会释放载体线程，
  # 因此同样的内存能支撑高得多的并发（尤其流式对话这种"一个请求挂几秒到几分钟"的场景）。
  #
  # ⚠️【唯一的陷阱】synchronized 包住阻塞调用会"钉住"载体线程，让虚拟线程退化成平台线程。
  # 本项目已核查：全后端仅一处 synchronized（CloudHttpGateway 的 HttpClient 双检锁），
  # 它只包了一段对象构造、不含任何网络 IO，因此无此风险。
  # 今后若新增"synchronized 包 IO"的代码，应改用 ReentrantLock。
  #
  # 可用环境变量 VIRTUAL_THREADS=false 关掉（万一遇到个别类库不兼容可快速回退）。
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}

  # ---------------------------------------------------------------- 本地私有配置
  # 把「不该进版本库」的东西（数据库密码、各类 API Key）单独放 application-local.yml，
  # 它已在 .gitignore 里排除。
  #
  # 前缀 optional: 的意义：文件不存在时【不报错】，直接用 application.yml 里的默认值。
  # 这样别人拿到仓库、没建这个文件也能启动（用默认的 root/空密码），
  # 而你的机器上因为有这个文件，会自动用你真实的密码覆盖。
  #
  # 已导入的配置优先级高于本文档，所以 application-local.yml 里的值会覆盖下面的默认值。
  config:
    import: optional:classpath:application-local.yml

  # ---------------------------------------------------------------- 数据源
  # 使用 MySQL：Spring AI 的对话记忆仓库只内置 hsqldb/mysql/postgresql/sqlserver
  # 四种方言、没有 SQLite，所以记忆持久化必须用 MySQL。
  datasource:
    # ⚠️ 时间参数踩坑记录（两条，都很隐蔽）
    #
    # 【坑 1】characterEncoding 必须写 Java 字符集名 UTF-8，不能写 MySQL 的 utf8mb4。
    #   这是两个不同层面的名字：
    #     · utf8mb4 是【MySQL 服务端】的字符集名，用在建库建表语句里；
    #     · JDBC 参数 characterEncoding 会被交给 Java 的 Charset.forName() 解析，
    #       只认 UTF-8 这类【Java 字符集名】。
    #   写错会直接启动失败：Unsupported character encoding 'utf8mb4'
    #   Connector/J 8.x 在 UTF-8 + 服务端 utf8mb4 的情况下会自动使用 utf8mb4，无需也无法显式指定。
    #
    # 【坑 2】不要用 serverTimezone=UTC，改用 connectionTimeZone=LOCAL + preserveInstants=false。
    #   实测现象：实体里是 08:22:56（UTC），接口也返回 08:22:56，但数据库里却存成 00:22:56
    #   —— 驱动把「UTC 墙上时间」当成 JVM 本地时间（东八区）又减了 8 小时。
    #   读回来是对得上的（接口层看不出异常），但在 Navicat 里查数据会明显不对劲，
    #   而且一旦有人用 SQL 直接统计时间就会全错。
    #   原因：preserveInstants 默认为 true，驱动会在「JVM 默认时区」与「connectionTimeZone」
    #   之间做瞬时转换。我们存的是 LocalDateTime（无时区的墙上时间），不需要也不该被转换。
    #   解法：connectionTimeZone=LOCAL（与 JVM 同区）+ preserveInstants=false（禁止转换），
    #   这样写进去什么、读出来就是什么。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ipas_assistant}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL&preserveInstants=false&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池由 HikariCP 原生管理（自带保活），无需手写保活逻辑
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      # MySQL 默认 8 小时断开空闲连接，设 30 分钟回收一次更保险
      max-lifetime: 1800000
      pool-name: IpasHikariPool

  # ---------------------------------------------------------------- JPA
  jpa:
    # 不用 Hibernate 自动建表：表结构由 db/schema-mysql.sql 显式管理，
    # 这样表结构是可读、可评审、可版本控制的。
    hibernate:
      ddl-auto: none
    # 启动时校验实体与表结构是否一致：不一致直接启动失败，
    # 避免运行到一半才发现「列不存在」。（比 ddl-auto=update 安全得多）
    properties:
      hibernate:
        format_sql: true
    open-in-view: false   # 关掉 OSIV：避免数据库连接被 HTTP 请求全程占用

  # 启动时执行建表脚本（脚本内部一律 IF NOT EXISTS，可重复执行）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
      continue-on-error: false

  # ---------------------------------------------------------------- Jackson
  # 【极其关键】接口 JSON 的命名与格式必须与前端约定一致，否则 React 前端要跟着改。
  jackson:
    # 接口 JSON 统一采用 snake_case 命名（active_skill_ids / created_at / token_type），
    # 而 Java 字段是 camelCase（activeSkillIds），这里统一转成 snake_case 输出。
    property-naming-strategy: SNAKE_CASE
    # 时间序列化为 ISO-8601 字符串而不是时间戳
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    # 忽略请求体里的未知字段，避免前端多传字段导致 400
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # 上传文件大小上限；超过后走 files 模块的自定义校验给出中文提示，这个值是兜底防线
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB

# ============================================================================
#  应用自身的业务配置（绑定到 AppProperties 类）
# ============================================================================
app:
  # ---- 安全 / JWT ----
  security:
    # ⚠️ 生产环境必须用环境变量覆盖，绝不能用这个开发默认值
    secret-key: ${SECRET_KEY:dev-secret-change-me}
    # 签名算法固定 HS256；jjwt 需要显式写 "HS256"
    algorithm: HS256
    # 默认 1440 分钟 = 24 小时
    access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:1440}

  # ---- 数据目录 ----
  # 上传文件、缓存等运行时数据统一放在 data/ 下，便于整体备份迁移：
  # data/uploads 存原始文件，data/cache 存磁盘缓存。
  data-dir: ${DATA_DIR:./data}

  # ---- 大模型 ----
  llm:
    # ollama = 本地推理；cloud = 云端 OpenAI 兼容平台
    provider: ${LLM_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen3:8b}
      # 关闭 qwen3 的思考：开思考会明显变慢，日常问答不需要
      think: ${OLLAMA_THINK:false}
      # 上下文窗口大小
      num-ctx: ${OLLAMA_NUM_CTX:8192}
    cloud:
      api-key: ${CLOUD_API_KEY:}
      base-url: ${CLOUD_BASE_URL:}
      model: ${CLOUD_MODEL:}
      # 云端「深度思考」开关；仅对流式调用生效
      enable-thinking: ${CLOUD_ENABLE_THINKING:false}
      thinking-budget: ${CLOUD_THINKING_BUDGET:0}
    # 视觉模型：用于课表截图识别等多模态任务
    vision-model: ${VISION_MODEL:qwen3-vl-plus}

    # ---- 模型调用的韧性保护（限流 / 熔断 / 退避重试）----
    # 这些值直接决定"云端抖动时用户是几乎无感，还是看到一个失败弹窗"。
    resilience:
      # 最多尝试几次（含首次）。1 = 不重试。只对"瞬时故障"（429 / 5xx / 超时）重试，
      # 参数错误与鉴权失败会立刻返回，不做无谓重试。
      max-attempts: ${LLM_MAX_ATTEMPTS:3}
      # 退避基数（毫秒）：第 1 次失败等它，第 2 次等 2 倍…… 避免服务刚抖动时继续加压。
      backoff-ms: ${LLM_BACKOFF_MS:500}
      # 连续多少次瞬时失败后打开熔断。打开后所有调用直接快速失败，不再去等超时（防雪崩）。
      circuit-threshold: ${LLM_CIRCUIT_THRESHOLD:5}
      # 熔断打开后冷却多久（毫秒）才允许再试。
      circuit-open-ms: ${LLM_CIRCUIT_OPEN_MS:30000}
      # 同时进行的模型调用上限。本地 Ollama 尤其怕并发：同时来一堆请求会一起变慢、最后一起超时；
      # 限流后表现为"排队稍慢"，而不是"集体失败"。
      max-concurrent: ${LLM_MAX_CONCURRENT:4}
      # 等待并发许可的最长时间（毫秒）：等不到就快速失败，比让用户干等更好。
      acquire-timeout-ms: ${LLM_ACQUIRE_TIMEOUT_MS:10000}

  # ---- Embedding / RAG ----
  rag:
    embed-base-url: ${EMBED_BASE_URL:http://localhost:11434/v1}
    embed-model: ${EMBED_MODEL:bge-m3}
    # 每个片段的目标字符数
    chunk-size: ${RAG_CHUNK_SIZE:500}
    # 相邻片段重叠字符数
    chunk-overlap: ${RAG_CHUNK_OVERLAP:80}
    # 全局默认检索片段数（Top-K）
    top-k: ${RAG_TOP_K:4}
    # 向量化批大小：一次发给 Ollama 的文本条数
    embed-batch: ${RAG_EMBED_BATCH:32}
    # 单次检索返回片段总上限：多知识库各自取 Top-K 后合并，防止撑爆上下文
    max-total-chunks: ${RAG_MAX_TOTAL_CHUNKS:30}
    # 最低相似度闸门：余弦相似度低于此值的片段直接丢弃。
    # 作用：用户问语料里根本没有的问题时，避免把一堆低分片段喂给模型导致幻觉；
    # 过滤后无片段会走"未检索到足够证据"的短路。
    # ⚠️ 0.35 是按 bge-m3 的常见分数分布给的起点，务必按自己的数据实测标定；
    # 若正常提问开始频繁答"未检索到足够证据"，说明偏高，调低即可（无需改代码）。
    # 设为 0 或负数 = 关闭闸门。
    min-similarity: ${RAG_MIN_SIMILARITY:0.35}
    # 证据字符预算：拼进提示词的证据总字数上限（比"条数上限"更贴近真实的上下文占用）。
    # 按相似度降序累加，超出即停止收录。0 或负数 = 不限制。
    evidence-max-chars: ${RAG_EVIDENCE_MAX_CHARS:6000}
    # 是否启用混合检索（向量通道 + 关键词通道 → RRF 融合）。
    # 关键词通道走 MySQL 全文索引（ngram 解析器，中文友好），补上向量检索对
    # "精确字面"（编号、配置项名、专有名词）召回不足的短板。
    # 全文索引缺失或查询异常时会自动降级为"只用向量通道"，不会让检索失败。
    hybrid-enabled: ${RAG_HYBRID_ENABLED:true}
    # 关键词通道的相对分数门槛：命中分数低于"本批最高分 × 该比例"的会被丢弃。
    # 用相对值是因为全文检索分值没有固定量纲（随语料变化）；0 或负数 = 不设门槛。
    keyword-relative-score-floor: ${RAG_KEYWORD_FLOOR:0.35}
    # 上下文扩窗：命中片段时，把同文件序号 ±N 的相邻片段一并作为证据（0 = 不扩窗）。
    # 命中的往往只是"一小段"，带上邻居能明显提升回答完整度；证据总量仍受上面的字符预算约束。
    neighbor-window: ${RAG_NEIGHBOR_WINDOW:1}

    # 一次性把历史片段的「JSON 向量」转成「二进制向量」（引入二进制存储时留的迁移器）。
    # 转换是纯格式搬运：不调用模型、不需要 Ollama，几万条也就几秒。
    # ⚠️ 环境变量只有在 yml 里这样声明过才会生效（见下面 vector-store 段也一样）——
    #    Spring 不会把任意环境变量自动映射到自定义配置键上。
    backfill-embeddings: ${RAG_BACKFILL_EMBEDDINGS:false}

    # ---- 向量检索后端 ----
    # mysql（默认）= 加载候选后在内存里算余弦，不依赖任何外部组件；
    # pgvector     = 把"向量 + chunk_id"放到 PostgreSQL 里做近邻检索（正文仍在 MySQL）。
    # 做成开关是硬要求：外部依赖出问题时能一条配置切回 MySQL，检索不至于整体失效。
    vector-store: ${VECTOR_STORE:mysql}
    pgvector:
      url: ${PGVECTOR_URL:jdbc:postgresql://127.0.0.1:5432/ipas_vectors}
      user: ${PGVECTOR_USER:ipas}
      # ⚠️ 凭据：走环境变量或 application-local.yml，不要提交进版本库
      password: ${PGVECTOR_PASSWORD:}
      # 向量维度，必须与嵌入模型一致（bge-m3 = 1024）；不一致时写入会被 PG 直接拒绝
      dimension: ${PGVECTOR_DIM:1024}
      # 一次性回填：启动时把 MySQL 里已有的向量搬到 pgvector。跑一次就把它去掉。
      # 搬的是"已经算好的向量"（不重新嵌入）：秒级完成，且不会因为模型版本变化导致向量漂移。
      backfill: ${RAG_BACKFILL_VECTORS:false}

  # ---- 对话上下文管理（历史压缩相关配置）----
  history:
    # 保留最近多少条原始消息（其余压缩进摘要）
    keep-recent: ${HISTORY_KEEP_RECENT:12}
    # 消息总数超过 keep-recent + 该值才启动摘要，避免短对话也调模型
    summary-trigger: ${HISTORY_SUMMARY_TRIGGER:8}
    # 防抖：新滑出窗口的消息不足这么多条时复用旧摘要
    summary-step: ${HISTORY_SUMMARY_STEP:6}
    # 单次喂给摘要模型的字符上限
    summary-max-chars: ${HISTORY_SUMMARY_MAX_CHARS:6000}
    # 摘要提示词里的字数上限
    summary-max-words: ${HISTORY_SUMMARY_MAX_WORDS:300}
    # 上下文压缩触发阈值（token）：SummarizationHook 用；超过才压缩。
    # 按 token 数触发（更贴合真实上下文占用），而非按消息条数。
    # <= 0 表示关闭上下文压缩（不挂该 hook）。
    summary-max-tokens: ${HISTORY_SUMMARY_MAX_TOKENS:3000}

  # ---- Agent 模型侧的对话记忆 ----
  agent:
    memory:
      # 记忆落库表的建表模式。三选一：
      #   CREATE_IF_NOT_EXISTS（默认，推荐）—— 幂等：表已存在就保留，不碰数据
      #   CREATE_NONE                       —— 不建表，需由 DBA 预先建好
      #                                         （数据库账号没有建表权限时必须用它）
      #   CREATE_OR_REPLACE                 —— 【危险】重建表 = 清空用户的对话记忆
      #
      # ⚠️ 契约测试用的是 CREATE_NONE：那套测试刻意不依赖 MySQL，
      #    而 CREATE_IF_NOT_EXISTS 在构造时要连库执行 DDL，在无库环境会失败。
      create-option: ${AGENT_MEMORY_CREATE_OPTION:CREATE_IF_NOT_EXISTS}

  # ---- 只读展示模式 ----
  # 打开后：除「浏览类请求（GET/HEAD/OPTIONS）」与「登录注册」之外，
  # 所有 /api 写操作都会被拒绝（403 + {"detail":"..."}）。
  # 用途：把系统在线演示给别人看时，避免对方误改、误删你的数据。默认关闭。
  preview-mode:
    enabled: ${PREVIEW_MODE:false}

  # ---- 文件存储后端 ----
  # local（默认）= 落在本地磁盘的 data/uploads/ 下；
  # minio = 存到 MinIO 对象存储（对象键与本地布局同一语义，见 MinioFileStorage）。
  # 业务代码只依赖 FileStoragePort 端口，所以切换后端只需改这一个值，
  # FileService / KbService 一行都不用动。实现选择靠 @ConditionalOnProperty。
  storage:
    backend: ${STORAGE_BACKEND:local}
    # MinIO 专用配置（仅 backend=minio 时生效）。
    # ⚠️ access-key / secret-key 是凭据：请用环境变量传入，不要写进这个文件、更不要提交版本库。
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:ipas-uploads}

  # ---- 文件上传 ----
  upload:
    max-mb: ${MAX_UPLOAD_MB:50}
    max-content-chars: ${MAX_CONTENT_CHARS:500000}

  # ---- 外部 API Key ----
  tools:
    # 天气优先高德（中文城市名、国内访问稳定）
    amap-api-key: ${AMAP_API_KEY:}
    openweathermap-api-key: ${OPENWEATHERMAP_API_KEY:}

  # ---- CORS 跨域白名单 ----
  cors:
    allowed-origins:
      - http://localhost:5174
      - http://127.0.0.1:5174

  # ---- 对话执行链路 ----
  chat:
    # 是否启用「确定性知识问答」：明确在问资料内容的问题，先检索、再把带编号的证据
    # 交给模型生成，不再依赖模型自己决定要不要检索（避免"这次调工具、下次不调"的不可复现）。
    # 打开是安全的：检索不到证据时会自动回退到 Agent 路径。
    kb-qa-enabled: ${CHAT_KB_QA_ENABLED:true}
    # 是否启用检索查询改写：多轮里的省略句（"那它怎么配置"）先结合历史补全再检索。
    # 只在问题看着像省略句时才真的调模型，所以对普通提问没有额外延迟。
    rewrite-enabled: ${CHAT_REWRITE_ENABLED:true}

# ============================================================================
#  接口文档（OpenAPI / Swagger UI）
#
#  打开后可访问：
#    · /swagger-ui.html   —— 可视化界面，按 Controller 分组，可直接发请求调试
#    · /v3/api-docs       —— 机器可读的 OpenAPI 描述（可供前端生成客户端）
#
#  ⚠️ 它会暴露接口清单，属于信息暴露面。开发与答辩演示时开启，
#     对外部署时用环境变量 SWAGGER_ENABLED=false 关掉（关掉后相关路径直接 404）。
# ============================================================================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    # 按接口路径排序，多模块时更容易定位
    operations-sorter: alpha
    tags-sorter: alpha

# ============================================================================
#  日志
# ============================================================================
logging:
  level:
    root: INFO
    com.ipas.assistant: DEBUG
    # 排查云端报错时重点看这两行日志（SQL 与业务日志）
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
