# ============================================================================
#  IPAS 前端 nginx 配置
#
#  职责：
#   1. 托管 Vite 构建出的静态文件（/usr/share/nginx/html）
#   2. SPA 路由回退：未知路径回 index.html（刷新 /courses 等子路由不 404）
#   3. 把 /api 反代到 backend 服务的 8002 端口
#
#  ★ SSE / 流式对话必须关缓冲（proxy_buffering off 等），
#    否则 chat 的流式响应会卡在「连接不结束」（对应 vite 开发代理里的那个 bug）。
# ============================================================================
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA：前端用 react-router，深链接刷新需要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 所有 /api 请求转发给后端 Spring Boot（同源，浏览器无跨域问题）
    location /api/ {
        # 注意：proxy_pass 不带结尾斜杠 → 原样转发 /api/... 路径
        # （即 http://backend:8002/api/...，与后端 context-path 一致）
        proxy_pass http://backend:8002;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 流式 / SSE 必需 ----
        proxy_buffering off;          # 关掉中间层缓冲，token 边生成边推
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;    # 长对话/深度思考放宽超时
    }
}
